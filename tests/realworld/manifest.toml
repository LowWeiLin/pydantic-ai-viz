# The real-world set: public projects that use Pydantic AI, which the static analyser is tried on.
#
# Nothing of these projects is kept in this repository. Each entry names a repository and one commit
# of it by its full SHA; the tests and scripts/realworld_report.py fetch that commit with git and read
# it. None of its code is imported or run.
#
#   uv run pytest -m network tests/realworld            # check every project against its entry
#   uv run python scripts/realworld_report.py           # the results as a Markdown table
#   uv run pydantic-ai-viz view gh:<repo>@<sha>/<subdir>  # look at one of them
#
# An entry:
#
#   id         a short name, unique in this file
#   repo       owner/name on GitHub
#   sha        the commit, as its full 40-character SHA: never a branch or a tag, which move
#   subdir     the directory to read, when it is not the whole repository
#   licence    the licence the repository declares, as an SPDX identifier
#   exercises  what kind of code it is, in a sentence
#   [project.expect]
#     min_files, min_agents, min_tools, min_graphs, min_delegations
#                what the analyser must find at the least. The numbers are what it found when the entry
#                was written, so a change that loses an agent, a tool or an edge fails the test.
#     agents, tools, graphs
#                labels and names that must be among what is found
#     delegations
#                edges that must be found, each as "label of the agent -> label of the agent it runs"

[[project]]
id = "pydantic-ai-examples"
repo = "pydantic/pydantic-ai"
sha = "679ed8942dd553c5aa2da25fa777135d9a1abc49"
subdir = "examples"
licence = "MIT"
exercises = "The examples of Pydantic AI itself: single agents with tools, structured output, RAG, a bank support agent with dependencies, and three examples in which one agent runs another."

[project.expect]
min_files = 49
min_agents = 36
min_tools = 24
min_delegations = 3
agents = ["support_agent", "weather_agent", "search_agent", "extraction_agent", "seat_preference_agent", "roulette_agent"]
tools = ["customer_balance", "get_lat_lng", "get_weather", "extract_flights", "retrieve", "roulette_wheel", "duckduckgo_search"]
delegations = ["search_agent -> extraction_agent", "triage_agent -> senior_doctor_agent", "camera_assistant -> diagram_drawer"]

