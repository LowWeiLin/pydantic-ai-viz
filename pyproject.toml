[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-viz"
dynamic = ["version"]
description = "See what your Pydantic AI agents are and what they do: blueprints, live runs and shareable replays. Unofficial, not affiliated with Pydantic."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "pydantic-ai-viz contributors" }]
keywords = [
    "pydantic-ai",
    "agents",
    "llm",
    "visualization",
    "tracing",
    "opentelemetry",
    "devtools",
    "pydantic-graph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-ai-slim>=2.60,<3",
    "opentelemetry-sdk>=1.30",
]

[project.optional-dependencies]
# The capabilities demo uses harness capabilities; its Skills capability needs PyYAML, from the skills extra.
demos = ["pydantic-ai-harness[skills]>=0.71"]

[project.urls]
Homepage = "https://github.com/LowWeiLin/pydantic-ai-viz"
Documentation = "https://lowweilin.github.io/pydantic-ai-viz/"
Repository = "https://github.com/LowWeiLin/pydantic-ai-viz"
Issues = "https://github.com/LowWeiLin/pydantic-ai-viz/issues"
Changelog = "https://github.com/LowWeiLin/pydantic-ai-viz/blob/main/CHANGELOG.md"

[project.scripts]
pydantic-ai-viz = "pydantic_ai_viz.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "inline-snapshot>=0.20",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pre-commit>=4",
]
# The harness capabilities the tests build live, with the extras Coder, Researcher and Skills need to construct.
# Left out with --no-group harness, which the lowest and latest CI jobs do: harness pins one pydantic-ai-slim.
harness = [
    "pydantic-ai-harness[coder,skills]>=0.71",
    "pydantic-ai-slim[duckduckgo,web-fetch]",
]
docs = [
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.28",
]

[tool.uv]
default-groups = ["dev", "harness"]

[tool.hatch.version]
path = "src/pydantic_ai_viz/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_viz"]
exclude = ["src/pydantic_ai_viz/_static/.gitignore"]
artifacts = ["src/pydantic_ai_viz/_static/viewer.html"]

[tool.hatch.build.targets.sdist]
# The shipped tests read /examples and /web/fixtures, so those go in too: the suite must pass from the sdist.
include = [
    "/src",
    "/tests",
    "/scripts",
    "/schema",
    "/examples",
    "/web/fixtures",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
artifacts = ["src/pydantic_ai_viz/_static/viewer.html"]

[tool.ruff]
line-length = 120
target-version = "py311"
# tests/fixtures/static holds source files the static analyser reads: some are deliberately broken or odd.
extend-exclude = ["web", "tests/fixtures/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PT", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstrings are required on the public API only.
"tests/**" = ["D"]
"scripts/**" = ["D"]
"examples/**" = ["D"]
"src/pydantic_ai_viz/_*.py" = ["D"]
"src/pydantic_ai_viz/demos/**" = ["D"]

[tool.pyright]
include = ["src", "tests", "scripts", "examples"]
# with_logfire.py imports logfire, which is not a dependency of this project.
# tests/fixtures/static is input for the static analyser, not code of this project.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "examples/with_logfire.py", "tests/fixtures/static"]
pythonVersion = "3.11"
# Import roots: src, as pyright assumes when none are named, and scripts, from which tests/realworld imports
# realworld_report by name, as the pythonpath of pytest lets it.
extraPaths = ["src", "scripts"]
typeCheckingMode = "basic"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/realworld imports scripts/realworld_report.py, which holds the manifest reader they share.
pythonpath = ["scripts"]
# Tests that fetch from GitHub are left out unless asked for: uv run pytest -m network tests/realworld
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not network"]
markers = [
    "network: needs the network (fetches pinned public repositories from GitHub); not part of the default run",
]
xfail_strict = true
