site_name: pydantic-ai-viz
site_description: >-
  See what your Pydantic AI agents are and what they do: blueprints, live runs
  and shareable replays. Unofficial, not affiliated with Pydantic.
site_url: https://lowweilin.github.io/pydantic-ai-viz/
repo_url: https://github.com/LowWeiLin/pydantic-ai-viz
repo_name: LowWeiLin/pydantic-ai-viz
edit_uri: edit/main/docs/
copyright: >-
  pydantic-ai-viz is an unofficial community project, not affiliated with or
  endorsed by Pydantic. Released under the MIT licence.

theme:
  name: material
  # System fonts only: the docs load nothing from a font CDN, like the viewer.
  font: false
  icon:
    logo: material/graph-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LowWeiLin/pydantic-ai-viz
      name: pydantic-ai-viz on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pydantic-ai-viz/
      name: pydantic-ai-viz on PyPI

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Demos: demos.md
  - Guides:
      - Visualize an agent: guides/visualize-an-agent.md
      - Watch live runs: guides/live-runs.md
      - Token streaming: guides/token-streaming.md
      - Graphs: guides/graphs.md
      - Export and share: guides/export-and-share.md
      - Use with Logfire: guides/logfire.md
      - Privacy: guides/privacy.md
  - Concepts:
      - Blueprint vs run: concepts/blueprint-vs-run.md
      - How static analysis works: concepts/how-static-analysis-works.md
      - How capture works: concepts/how-capture-works.md
  - Reference:
      - Python API: reference/python-api.md
      - CLI: reference/cli.md
      - Wire format: reference/wire-format.md
      - Compatibility: reference/compatibility.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      # contributing.md and changelog.md include the files at the repo root.
      base_path: [.]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

watch:
  - src/pydantic_ai_viz
  - CONTRIBUTING.md
  - CHANGELOG.md

# Every broken link, missing nav entry or bad anchor is a warning, and the
# docs are built with --strict, so each one fails the build.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
