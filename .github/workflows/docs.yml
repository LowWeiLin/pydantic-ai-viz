name: Docs

# Builds the documentation site and the hosted demo. Pull requests only build;
# pushes to main also deploy to GitHub Pages:
#   /        the MkDocs site
#   /demo/   the viewer with recordings of the bundled demos
#   /schema/ the wire-format JSON Schema, at the URL its $id names
#
# One-time setup on GitHub, before the first push to main: in the repository's
#   Settings > Pages > Build and deployment, set Source to "GitHub Actions".
#   Until that is done the deploy job fails ("Get Pages site failed") and the
#   documentation URL answers 404.
#
# While the repository is private the site is built but not deployed, so a
#   plan without Pages for private repositories does not fail every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: "1"
  PYDANTIC_AI_NO_BANNER: "1"
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    name: Build docs and demo site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: "11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the viewer
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked --group docs

      - name: Build the docs
        run: uv run mkdocs build --strict

      # After mkdocs, which empties site/ before it builds.
      - name: Build the hosted demo
        run: uv run python scripts/build_demo_site.py --out site/demo

      - name: Publish the wire schema next to the docs
        run: |
          mkdir -p site/schema
          cp schema/pviz.schema.json site/schema/pviz.schema.json

      - name: Check the site layout
        run: |
          test -f site/index.html
          test -f site/demo/index.html
          test -f site/demo/recordings/index.json
          test -f site/demo/recordings/source.pviz.jsonl
          test -f site/schema/pviz.schema.json

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
