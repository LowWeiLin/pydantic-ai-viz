name: Real-world set

# Tries the static analyser on real projects: the public repositories listed in
# tests/realworld/manifest.toml, each pinned to a commit. They are fetched from
# GitHub with git and only read; none of their code is imported or run.
#
# This needs the network and says nothing about a pull request that the offline
# suite does not, so it runs once a week and on request, never on a push or a
# pull request. On failure it opens an issue, or comments on the one that is open.

on:
  schedule:
    - cron: "41 5 * * 3" # Wednesdays, 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realworld
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PYDANTIC_AI_NO_BANNER: "1"
  PYDANTIC_AI_VIZ_CACHE_DIR: ${{ github.workspace }}/.realworld-cache

jobs:
  realworld:
    name: Analyse the pinned projects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Check every project against its manifest entry
        run: uv run pytest -m network tests/realworld -q

      - name: Write the results table
        # Also when a check failed: the table shows which project, and how far it got.
        if: ${{ !cancelled() }}
        run: |
          uv run python scripts/realworld_report.py --out realworld-results.md || status=$?
          {
            echo "## Real-world set"
            echo
            cat realworld-results.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: realworld-results
          path: realworld-results.md
          if-no-files-found: ignore

      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create realworld --repo "$GITHUB_REPOSITORY" --force \
            --color 5319E7 --description "A pinned real-world project is no longer analysed as expected"

          body="The weekly run over the real-world set failed.

          Run: ${RUN_URL}

          The job summary has the results table. Likely causes: a repository in \`tests/realworld/manifest.toml\` was deleted, renamed or made private, or a change to the analyser lost something an entry expects."

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label realworld --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label realworld \
              --title "Real-world set: the weekly analysis failed" \
              --body "$body"
          fi
